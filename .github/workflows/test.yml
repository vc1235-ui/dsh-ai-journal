name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Aggregation tests
        run: node --test test/journal.test.mjs test/dismissed.test.mjs
      - name: Panel rendering tests
        run: node test/client.test.cjs
